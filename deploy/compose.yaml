# The app stack on the server, one file for both environments: docker compose project "prod" or "staging"
# (the test stand). Do not run docker compose on this file directly: use deploy/deploy.sh (deploys a version)
# or deploy/compose.sh (manual commands). They pick the environment (use_env in deploy/lib.sh) and set
# the project name, the env file, APP_URL, APP_PORT, the memory limits and APP_IMAGE, the app image to run.
# Logs of the containers: deploy/logs.sh.
#
# Secrets come from the .env of the environment (mode 600): /home/deploy/personal-crm/.env for prod,
# /home/deploy/personal-crm-staging/.env for the test stand. One line each:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB - the database
#   OWNER_EMAIL         - the owner of the data that existed before sign-in (migrations, demo data)
#   BETTER_AUTH_SECRET  - signs the session cookies, a long random string
#   SMTP_URL            - where sign-in emails go: smtps://resend:<Resend key>@smtp.resend.com:465
# Every one of them is required: without a line any compose command stops at once, so a deploy
# stops at its first step, before the backup, changing nothing.

x-logging: &logging
  # Container logs go to the server journal (journald), not to files of the container: they stay after
  # the container is replaced (deploy, rollback, restore, restart). journald limits the size of the whole
  # journal itself and deletes the oldest lines. Read them with deploy/logs.sh.
  driver: journald
  options:
    # The name of each journal line: the container name (prod-app-1, staging-postgres-1, prod-migrate-run-...).
    # deploy/server-setup/rsyslog/10-personal-crm.conf keeps lines with these names out of /var/log/syslog.
    tag: "{{.Name}}"
    # Journal fields COM_DOCKER_COMPOSE_PROJECT (prod or staging) and COM_DOCKER_COMPOSE_SERVICE
    # (app, postgres, migrate, seed). They do not change when a container is replaced: logs.sh filters by them.
    labels: "com.docker.compose.project,com.docker.compose.service"

x-db-credentials: &db-credentials
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}

x-app-env: &app-env
  <<: *db-credentials
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

# Read by the migrations (the owner of existing data, drizzle/0005_*) and the demo data.
x-owner-env: &owner-env
  <<: *app-env
  OWNER_EMAIL: ${OWNER_EMAIL:?OWNER_EMAIL is not set in .env}

# Shared by the app and the one-off containers made from the same image.
x-app-base: &app-base
  image: ${APP_IMAGE:?APP_IMAGE is not set, run this stack through deploy/deploy.sh or deploy/compose.sh}
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
  # 0 = no limit (prod), the test stand has one.
  mem_limit: ${APP_MEMORY_LIMIT:?APP_MEMORY_LIMIT is not set, run this stack through deploy/deploy.sh or deploy/compose.sh}
  logging: *logging

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: *db-credentials
    # No published port: only containers of this project can reach the database.
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: ${POSTGRES_MEMORY_LIMIT:?POSTGRES_MEMORY_LIMIT is not set, run this stack through deploy/deploy.sh or deploy/compose.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    <<: *app-base
    restart: unless-stopped
    environment:
      <<: *app-env
      # The public address of the environment: sign-in links lead here; https makes the session cookies Secure.
      BETTER_AUTH_URL: ${APP_URL:?APP_URL is not set, run this stack through deploy/deploy.sh or deploy/compose.sh}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is not set in .env}
    # Only nginx on the same server reaches the app, the port is not open to the internet.
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT is not set, run this stack through deploy/deploy.sh or deploy/compose.sh}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # One-off: applies database migrations and exits. deploy.sh runs it before starting a new app version.
  migrate:
    <<: *app-base
    profiles: ["tools"]
    environment: *owner-env
    command: ["drizzle-kit", "migrate"]

  # One-off, by hand only: demo contacts for the owner, if the owner has no contacts yet.
  seed:
    <<: *app-base
    profiles: ["tools"]
    environment: *owner-env
    command: ["tsx", "scripts/seed.ts"]

volumes:
  postgres-data:

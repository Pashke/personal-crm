<!doctype html>
<!-- managed-by: personal-crm deploy/server-setup -->
<!-- nginx shows this page while the app container is down or restarting (error_page 502 504). -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Личная CRM</title>
  <style>
    :root {
      --color-bg: #f7f7f5;
      --color-text: #1f1f1f;
      --color-muted: #6b6b6b;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-size-title: 2rem;
      --space-md: 1rem;
      --space-lg: 2rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #161616;
        --color-text: #ededed;
        --color-muted: #a0a0a0;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: var(--space-lg);
      display: grid;
      place-items: center;
      text-align: center;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
    }
    h1 { margin: 0 0 var(--space-md); font-size: var(--font-size-title); }
    p { margin: 0; color: var(--color-muted); }
  </style>
</head>
<body>
  <main>
    <h1>Личная CRM</h1>
    <p>Приложение временно недоступно. Обновите страницу через минуту.</p>
  </main>
</body>
</html>

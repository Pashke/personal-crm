# managed-by: personal-crm deploy/server-setup
# The container logs of personal-crm stay in the server journal (journald) only, where journald limits
# their size. rsyslog copies every journal line to /var/log/syslog too, and that file is rotated by time
# (weekly), not by size: a flood of app errors could fill the disk there. So lines of our containers are
# dropped here, before the rules of 50-default.conf; all other lines go to syslog as before.
# The names come from the logging tag in deploy/compose.yaml: <prod|staging>-<service>-...
if re_match($programname, '^(prod|staging)-(app|postgres|migrate|seed)-') then stop

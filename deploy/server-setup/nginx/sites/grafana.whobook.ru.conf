# managed-by: personal-crm deploy/server-setup
# Grafana of the monitoring (deploy/monitoring), on 127.0.0.1:3002. nginx asks for the login and password
# (basic auth, set by grafana-password.sh) and tells Grafana who signed in, in the X-WEBAUTH-USER header.
# Grafana trusts this header from 127.0.0.1 only (auth proxy) and asks nothing more.
# While Grafana is down or restarting, visitors who signed in see a short "unavailable" page instead of a bare 502.

# Grafana's live updates in the browser use WebSocket: pass the upgrade on. The name is unique to this file.
map $http_upgrade $whobook_grafana_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name grafana.whobook.ru;
    include snippets/whobook-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name grafana.whobook.ru;
    include snippets/whobook-grafana-ssl.conf;

    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/whobook-grafana.htpasswd;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Who signed in. Whatever a visitor puts in this header is replaced here.
        proxy_set_header X-WEBAUTH-USER $remote_user;
        # The password stays in nginx: Grafana would check it again by itself and refuse.
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $whobook_grafana_connection;
    }

    error_page 502 504 /unavailable.html;
    location = /unavailable.html {
        root /var/www/grafana.whobook.ru;
        internal;
    }
}

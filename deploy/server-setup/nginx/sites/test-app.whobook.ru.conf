# managed-by: personal-crm deploy/server-setup
# The test stand: like app.whobook.ru, but the app container is on 127.0.0.1:3001
# and the whole site asks for a login and password (basic auth, set by staging-password.sh).
# Requests from the server itself pass without a password: that is the smoke test of deploy.sh.
# While the app container is down or restarting, visitors see a short "unavailable" page instead of a bare 502.

server {
    listen 80;
    server_name test-app.whobook.ru;
    include snippets/whobook-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name test-app.whobook.ru;
    include snippets/whobook-test-app-ssl.conf;

    # Either the request comes from the server itself, or it carries the login and password.
    satisfy any;
    allow 127.0.0.1;
    deny all;
    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/whobook-test-app.htpasswd;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The stand password stays in nginx: the app never sees it.
        proxy_set_header Authorization "";
    }

    error_page 502 504 /unavailable.html;
    location = /unavailable.html {
        root /var/www/test-app.whobook.ru;
        internal;
    }
}

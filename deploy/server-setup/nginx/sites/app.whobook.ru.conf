# managed-by: personal-crm deploy/server-setup
# The app: nginx terminates HTTPS and passes requests to the app container on 127.0.0.1:3000.
# While the app container is down or restarting, visitors see a short "unavailable" page instead of a bare 502.

server {
    listen 80;
    server_name app.whobook.ru;
    include snippets/whobook-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.whobook.ru;
    include snippets/whobook-ssl.conf;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    error_page 502 504 /unavailable.html;
    location = /unavailable.html {
        root /var/www/app.whobook.ru;
        internal;
    }
}

# managed-by: personal-crm deploy/server-setup (stub)
# Landing page. Until the landing is deployed, nginx serves a stub page.
# When the landing gets its own config: replace this file and drop the "managed-by" line,
# then setup.sh will not overwrite it.

server {
    listen 80;
    server_name whobook.ru;
    include snippets/whobook-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name whobook.ru;
    include snippets/whobook-ssl.conf;

    root /var/www/whobook.ru;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

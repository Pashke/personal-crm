# managed-by: personal-crm deploy/server-setup
# Requests by bare IP or by unknown host names: close the connection without an answer.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

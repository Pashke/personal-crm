# managed-by: personal-crm deploy/server-setup
# Certificate of the test stand test-app.whobook.ru (certbot --cert-name test-app.whobook.ru),
# separate from the one of whobook.ru and app.whobook.ru. The other settings are the same as in whobook-ssl.conf.
ssl_certificate     /etc/letsencrypt/live/test-app.whobook.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/test-app.whobook.ru/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:whobook_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

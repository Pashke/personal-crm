# Where Grafana takes the numbers from: Prometheus of the monitoring (deploy/monitoring/compose.yaml).
# The page and the alert rules refer to it by uid "prometheus".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      # How often Prometheus collects (prometheus.yml): graphs never ask for finer steps.
      timeInterval: 30s

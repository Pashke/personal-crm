# The monitoring of the server, prod and the test stand: docker compose project "monitoring", one for the
# whole server. Do not run docker compose on this file directly: deploy/monitoring.sh (Deploy prod runs it)
# checks the settings, copies this folder to a new /home/deploy/personal-crm-monitoring/config-<time>/ and starts
# the project from there. Logs: deploy/logs.sh monitoring <service>.
#
# Every container uses the network of the server itself (network_mode: host) and listens on 127.0.0.1 only,
# so nothing here is reachable from the internet (ufw also closes these ports):
#   grafana        127.0.0.1:3002  graphs and alert emails; nginx serves it as https://grafana.whobook.ru
#   prometheus     127.0.0.1:9090  collects the numbers every 30 seconds and keeps them 30 days, at most 1 GB
#   node-exporter  127.0.0.1:9100  numbers of the server: processor, memory, disk; and the time of the last backup
#   blackbox       127.0.0.1:9115  checks /health of prod and the test stand and the HTTPS certificates
# The numbers of the prod database come from postgres-exporter on 127.0.0.1:9187, a service of deploy/compose.yaml.
# The host network is also why the test stand check passes without the stand password: nginx lets 127.0.0.1 in.
#
# Settings from /home/deploy/personal-crm-monitoring/.env (mode 600), one line each:
#   ALERT_EMAIL                 - where the alert emails go
#   GF_SECURITY_ADMIN_PASSWORD  - password of Grafana's built-in admin; nobody signs in with it, it just is not the default
#   GF_SMTP_PASSWORD            - the Resend API key of the monitoring
# Without any of them every compose command stops at once.
#
# Memory limits: 544 MB here, 592 MB together with postgres-exporter. The server has 1.8 GB.

x-logging: &logging
  # Like the app: logs go to the server journal and stay there after a container is replaced.
  # deploy/server-setup/rsyslog/10-personal-crm.conf keeps lines with these names out of /var/log/syslog.
  driver: journald
  options:
    tag: "{{.Name}}"
    labels: "com.docker.compose.project,com.docker.compose.service"

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/monitoring/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ${CONFIG_DIR:?CONFIG_DIR is not set, run this through deploy/monitoring.sh}:/etc/monitoring:ro
      - prometheus-data:/prometheus
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      # *.prom files written by the server scripts: the time of the newest daily backup (deploy/lib.sh).
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ${TEXTFILE_DIR:?TEXTFILE_DIR is not set, run this through deploy/monitoring.sh}:/textfile:ro
    mem_limit: 48m
    logging: *logging

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/monitoring/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ${CONFIG_DIR:?CONFIG_DIR is not set, run this through deploy/monitoring.sh}:/etc/monitoring:ro
    mem_limit: 48m
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3002"
      GF_SERVER_ROOT_URL: https://grafana.whobook.ru/
      # Data source, the "Сервер и приложение" page, alert rules, the email and how often it is sent:
      # files of deploy/monitoring/grafana. In Grafana they are read-only.
      GF_PATHS_PROVISIONING: /etc/monitoring/grafana/provisioning
      # Sign-in: nginx asks for the login and password (basic auth) and passes the login in X-WEBAUTH-USER.
      # Grafana trusts this header from 127.0.0.1 only, and listens on 127.0.0.1 only.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 127.0.0.1
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The owner signs in with full rights: sees everything and can silence an alert.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is not set in .env}
      # Grafana does not call home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Alert emails go through Resend, from the same address as the sign-in emails, with their own key.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:465
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:?GF_SMTP_PASSWORD is not set in .env}
      GF_SMTP_FROM_ADDRESS: noreply@mail.crm.whobook.ru
      GF_SMTP_FROM_NAME: "Личная CRM: мониторинг"
      # Read by grafana/provisioning/alerting/contact-points.yaml.
      ALERT_EMAIL: ${ALERT_EMAIL:?ALERT_EMAIL is not set in .env}
    volumes:
      - ${CONFIG_DIR:?CONFIG_DIR is not set, run this through deploy/monitoring.sh}:/etc/monitoring:ro
      # Grafana's own database: the user, silenced alerts, the state of the alerts.
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:

# Push to main -> image tagged with the commit SHA -> GHCR -> the test stand (https://test-app.whobook.ru):
# migrations -> new version -> smoke /health.
# Prod is not deployed from here: only by hand, with the Deploy prod workflow. It takes only commits that have
# a successful run of this workflow on main: these runs are the history of the test stand.
# The deploy logic lives in deploy/ (see deploy/ci-deploy.sh and deploy/deploy.sh); this file only calls it.
name: Deploy staging

on:
  push:
    branches: [main]
  # Lets you re-run a deploy of the latest main to the test stand by hand from the Actions tab.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pashke/personal-crm

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to the test stand
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deploys to the test stand never overlap and are never cancelled halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Migrations, new version, smoke /health
        run: bash deploy/ci-deploy.sh staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
